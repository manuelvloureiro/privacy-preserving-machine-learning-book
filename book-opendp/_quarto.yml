# The OpenDP book: the OpenDP library from its first release to synthetic data, in the order of its documentation.
# Build with `make opendp` or `make opendp-pdf`, which stage it in _build/opendp-website/ or _build/opendp-pdf/
# like the other books. How to write it: the OpenDP section of AGENTS.md.
project:
  type: book
  output-dir: _book  # inside the staged copy; the Makefile copies it to _book/book-opendp/
  render:
    - "*.md"
    - "!README.md"
    - "!**/README.md"

book:
  title: "Differential Privacy with OpenDP"
  subtitle: "The OpenDP library from a first release to synthetic data"
  output-file: Differential-Privacy-with-OpenDP
  chapters:
    - index.md
    - part: part01-getting-started/00-introduction.md
      chapters:
        - part01-getting-started/01-first-release.md
        - part01-getting-started/02-the-data-and-the-context.md
    - part: part02-tabular-data/00-introduction.md
      chapters:
        - part02-tabular-data/03-essential-statistics.md
        - part02-tabular-data/04-grouping.md
        - part02-tabular-data/05-identifier-truncation.md
        - part02-tabular-data/06-preparing-microdata.md
        - part02-tabular-data/07-utility-and-noise.md
    - part: part03-framework/00-introduction.md
      chapters:
        - part03-framework/08-a-framework-for-privacy.md
        - part03-framework/09-transformations.md
        - part03-framework/10-measurements.md
        - part03-framework/11-combinators.md
        - part03-framework/12-utilities-and-the-context-api.md
    - part: part04-extending/00-introduction.md
      chapters:
        - part04-extending/13-plugins.md
        - part04-extending/14-statistical-modelling.md
        - part04-extending/15-limitations-and-troubleshooting.md
    - part: part05-synthetic-data/00-introduction.md
      chapters:
        - part05-synthetic-data/16-contingency-tables.md
        - part05-synthetic-data/17-aim-and-mst.md
        - part05-synthetic-data/18-evaluating-synthetic-data.md

  appendices:
    - glossary.md     # generated by tools/terms.py into the staged copy
    - term-index.md   # generated by tools/terms.py into the staged copy

filters:
  - filters/links.lua           # links to code/, tests/ and the other books; PDF: unlink the part pages
  - filters/book-checks.lua     # numbers every equation, warns on uncaptioned tables and figures
  - filters/term-index.lua   # PDF only: index entries with page numbers (from _terms.json)
  - quarto

# Fonts, theme, PDF class and the dated version on the cover: shared by every book, copied into
# the staged copy by the Makefile.
metadata-files:
  - _common.yml
  - _book-common.yml
