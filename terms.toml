# Acronyms and index terms, shared by the four books and the study notes.
# tools/terms.py reads this file:
#   make terms-check   validate acronym usage on every page
#   the builds         generate glossary.md, term-index.md and _terms.json in each staged copy
#
# [acronyms]  ACR = "expansion"  must be expanded at its first use on every page that uses it,
#             as "expansion (ACR)" or "ACR (expansion)".
#             ACR = { expansion = "...", expand = false }  is well known: listed in the glossary,
#             no expansion required.
# [names]     uppercase names that aren't acronyms to explain (venues, standards bodies, tools,
#             datasets, schemes named after people). Ignored by the checks, left out of the glossary.
# [index]     "term" = ["other spelling", ...]  matched case-insensitively, plurals included.

# Pages left out of the index of terms (their acronyms are still checked).
index_skip_pages = []

