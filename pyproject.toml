[project]
name = "privacy"
version = "0.1.0"
description = "Notes and code for a book on privacy-preserving machine learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "mplfonts>=0.0.11",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "quarto-cli>=1.10.19",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]
# The libraries the practitioner edition's snippets and workflow scripts run (tests marked `libs`).
# Pinned exactly, so the numbers the book quotes stay reproducible. torch is the CPU build.
practitioner = [
    "dp-accounting==0.6.0",
    "diffprivlib==0.6.6",
    "fastexcel==0.21.0",
    "opacus==1.6.0",
    "opendp[polars]==0.16.0",
    "peft==0.21.2",
    "scikit-learn==1.8.0",  # diffprivlib 0.6.6 does not import with scikit-learn 1.9
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers==5.20.2",
]

[tool.uv]
default-groups = ["dev", "practitioner"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["libs: runs a library from the practitioner dependency group (torch, Opacus, OpenDP, ...)"]


[tool.pyright]
include = ["code", "tests", "tools"]
exclude = ["archive", ".venv"]
# code/practitioner_datasets.py is shared by the practitioner scripts, which add code/ to sys.path.
extraPaths = ["code"]
# Hand-written stubs for the untyped practitioner libraries (Opacus, dp-accounting, scikit-learn, SciPy, ...).
stubPath = "typings"
typeCheckingMode = "strict"
# matplotlib's stubs leave **kwargs untyped, which flags every Axes call in strict mode.
reportUnknownMemberType = false

# Matches the VSCode setup: ruff formats on save, fixes what it can and sorts imports.
[tool.ruff]
line-length = 120
extend-exclude = ["archive"]

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["E402"]

# The practitioner scripts set Opacus's per-sample gradients with setattr (torch's stubs don't declare the
# attribute), and use typed lambdas as dataclass defaults so that strict pyright can infer the type.
[tool.ruff.lint.per-file-ignores]
"code/*/practitioner_*.py" = ["B010", "PIE807"]
