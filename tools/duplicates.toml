# Settings for tools/duplicates.py (PLAN step 8): which paragraphs count as repeats, and which
# repeats stay. A result has one home; every other page cites it (AGENTS.md).

shingle = 7        # words in a run that two paragraphs must share
min_words = 40     # shorter paragraphs are skipped: they repeat a definition or a caveat by design
threshold = 0.35   # share of the shorter paragraph's runs found in the other one
max_holders = 30   # a run in more paragraphs than this is a stock phrase, not a repeat

# Each allowed repeat names its two pages and says why it stays.
# [[allow]]
# pages = ["book-full/…", "book-practitioner/…"]
# reason = "…"

[[allow]]
pages = ["book-full/part04-privacy-accounting/01-renyi-dp.md", "book-full/appendix-derivations/02-composition.md"]
reason = "the appendix redoes the composition step from scratch, which a core appendix is for"

