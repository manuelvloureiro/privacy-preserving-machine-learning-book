# The skeletons tools/structure.py checks, per book: what AGENTS.md says a page of each kind looks like,
# written as rules a tool can keep. A page is matched to the first glob that fits it; README.md,
# glossary.md and term-index.md are never checked. Pages under a book's `legacy` list have not been
# converted to their skeleton yet: `check` skips them (`--strict` does not), and a conversion removes
# the page's line. Headings are compared by the text before a colon, ignoring case, so "## Code: what
# the script checks" is "## Code".

[books.book-full]
pages = [
  { glob = "index.md", skeleton = "preface" },
  { glob = "part*/00-introduction.md", skeleton = "part-page" },
  { glob = "part*/[0-9][0-9]-*.md", skeleton = "full-chapter" },
  { glob = "appendix-derivations/0[1-4]-*.md", skeleton = "core-appendix" },
  { glob = "appendix-derivations/*.md", skeleton = "appendix" },
]
# Every chapter, until it is converted to the environment skeleton (AGENTS.md, Chapter structure).
legacy = [
  "part01-prerequisites/00-introduction.md",
  "part01-prerequisites/01-distributions.md",
